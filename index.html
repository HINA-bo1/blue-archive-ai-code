<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Blue Archive AI Code —— 面向蔚蓝档案玩家的 AI 工具与代码方案。" />
  <title>Blue Archive AI Code</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="wallpaper/wallpaper.css" />
  <link rel="stylesheet" href="home-scene.css?v=20261007b" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27><rect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230b7fe8%27/><text x=%2732%27 y=%2743%27 font-size=%2726%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27>BA</text></svg>" />
</head>
<body>

  <!-- 密码锁屏 -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2>Blue Archive AI Code</h2>
      <p>请输入访问密码</p>
      <input type="password" class="lock-input" id="lockPassword" placeholder="密码" autocomplete="off" />
      <p class="lock-error" id="lockError"></p>
      <button type="button" class="btn btn-primary btn-block" id="lockEnter">进入网站</button>
    </div>
  </div>

  <!-- 导航栏（首页沉浸版：链接改为滚动到对应场景） -->
  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="brand">
        <span class="brand-mark">BA</span>
        <span class="brand-name">Blue Archive AI Code</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="#" data-goto="0">首页</a></li>
        <li><a href="#" data-goto="0.70">设定集</a></li>
        <li><a href="#" data-goto="0.79">好感度</a></li>
        <li><a href="#" data-goto="0.88">交互</a></li>
        <li><a href="#" data-goto="0.97">联系</a></li>
      </ul>
    </nav>
  </header>

  <!-- ============================================================
       滚动叙事舞台：520vh 滚动容器 + sticky 100vh 视口
       ============================================================ -->
  <div class="ba-scroll" id="baScroll">
    <div class="ba-stage" id="baStage">

      <!-- 图层 1：世界背景（还原工坊壁纸 3032469660「一切奇迹的始发点」场景） -->
      <div class="ly-world" id="lyWorld">
        <div class="w-sky"></div>
        <div class="w-water"></div>
        <div class="w-shimmer"></div>
        <div class="w-glow"></div>
        <div class="w-mountain"></div>
        <img class="w-president" src="assets/home/president-body.png" alt="" />
        <img class="w-president-ref" src="assets/home/president-body.png" alt="" />
        <div class="w-meteors" aria-hidden="true">
          <i class="meteor m1"></i>
          <i class="meteor m2"></i>
          <i class="meteor m3"></i>
        </div>
        <div class="w-shade"></div>
      </div>

      <!-- 图层 2.5：弧形卡滑块（Scene 2） -->
      <div class="arc-wrap" id="arcWrap"></div>

      <!-- 图层 2：底部雾气（Scene 2 柔化过渡，跟随视差） -->
      <div class="ly-clouds" id="lyClouds">
        <svg viewBox="0 0 1600 220" preserveAspectRatio="none" aria-hidden="true">
          <g fill="rgba(214,196,246,.22)">
            <ellipse cx="180" cy="170" rx="260" ry="70"/>
            <ellipse cx="520" cy="190" rx="300" ry="62"/>
            <ellipse cx="900" cy="176" rx="280" ry="74"/>
            <ellipse cx="1320" cy="192" rx="320" ry="66"/>
          </g>
          <g fill="rgba(248,232,252,.3)">
            <ellipse cx="320" cy="204" rx="240" ry="52"/>
            <ellipse cx="760" cy="212" rx="260" ry="48"/>
            <ellipse cx="1180" cy="206" rx="250" ry="50"/>
          </g>
        </svg>
      </div>

      <!-- 图层：Spine 壁纸（2K，Scene 1 主视觉，保留交互） -->
      <section class="hero-wallpaper is-loading" id="baHeroWallpaper">
        <canvas id="baWallpaperCanvas"></canvas>
        <canvas id="baWallpaperOverlay"></canvas>
        <div class="hw-scrim-top"></div>
        <div class="hw-scrim-bottom"></div>
        <div class="hw-loading"><div class="hw-spinner"></div><span>壁纸加载中</span></div>
        <div id="baWallpaperTextbox" class="hw-textbox"></div>
      </section>

      <!-- 图层 3：穿越门（门芯透出那片天空 + 十字星光） -->
      <div class="ly-portal" id="lyPortal">
        <div class="portal-ring">
          <img class="portal-star" src="assets/home/star04.png" alt="" />
          <span class="portal-glyph">SCHALE</span>
        </div>
      </div>

      <!-- 图层 3.5：底部渐隐 -->
      <div class="ly-fade-bottom"></div>

      <!-- 图层 4：左右幕布 -->
      <div class="ly-curtain ly-curtain-l" id="lyCurtainL"></div>
      <div class="ly-curtain ly-curtain-r" id="lyCurtainR"></div>

      <!-- 顶部渐隐 -->
      <div class="ly-fade-top"></div>

      <!-- Scene 1 UI（旧宣传卡已移除，内容并入 Scene 2 模块；滚动提示已隐藏） -->
      <div class="scene1" id="scene1">
        <div class="scene-cue fade-in">
          <span>DESCEND</span>
          <i>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </i>
        </div>
      </div>

      <!-- Scene 2 UI -->
      <div class="scene2" id="scene2">
        <h2>深入基沃托斯 · 模型档案</h2>
        <p>设定集、好感度模型、交互模型与联系方式，随滚动依次展开 —— 点开任意一张，查看完整设定。</p>
      </div>

    </div>
  </div>

  <!-- 详情弹出层 -->
  <div class="ba-panel" id="baPanel" role="dialog" aria-modal="true">
    <div class="ba-panel-box">
      <div class="ba-panel-head">
        <div>
          <h3 id="baPanelTitle">模块</h3>
          <p id="baPanelSub"></p>
        </div>
        <button type="button" class="ba-panel-close" id="baPanelClose" aria-label="关闭">✕</button>
      </div>
      <div class="ba-panel-body" id="baPanelBody"></div>
    </div>
  </div>

  <!-- 联系表单：常驻 DOM（script.js 在加载时绑定它的 AJAX 提交），弹出层时搬进详情框 -->
  <div id="contactHost" style="display:none">
    <form class="contact-form" id="contactForm" method="POST" action="https://formsubmit.co/wsh260622@outlook.com">
      <input type="hidden" name="_subject" value="【Blue Archive AI Code】网站新消息" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_template" value="table" />
      <div class="form-row">
        <input type="text" name="name" placeholder="你的称呼" required />
        <input type="email" name="email" placeholder="邮箱地址" required />
      </div>
      <textarea name="message" rows="5" placeholder="你的建议或需求" required></textarea>
      <button type="submit" class="btn btn-primary btn-block">发送消息</button>
      <p class="form-note" id="formNote" hidden>✓ 已收到，我们会尽快联系你！</p>
    </form>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> Blue Archive AI Code · 用心做好每一个工具</p>
      <p>作者MFC（抖音） · 我懒勿扰（抖音） · @橘光（抖音）</p>
      <p class="footer-links">
        <a href="#" data-goto="0">首页</a> · <a href="#" data-goto="0.70">设定集</a> ·
        <a href="#" data-goto="0.79">好感度</a> · <a href="#" data-goto="0.88">交互</a> ·
        <a href="#" data-goto="0.97">联系</a>
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="wallpaper/spine-webgl-4.2.js"></script>
  <script src="wallpaper/wallpaper.js"></script>
  <audio id="baBgm" src="assets/home/bgm.mp3" loop preload="auto"></audio>
  <script src="home-data.js?v=20261007b"></script>
  <script src="home-scene.js?v=20261007b"></script>
</body>
</html>
